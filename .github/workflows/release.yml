name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # annotated tag messages become the release notes

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Name the APK after the tag
        id: apk
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="Tango-${version}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        run: |
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          cat >> notes.md <<'NOTES'

          ---

          **インストール**: APK を端末に移してファイルアプリから開いてください。
          初回は「不明なアプリのインストール」の許可が必要です。上書きインストールで
          学習履歴は保持されます（データベースは追加のみの移行）。

          この APK は利便のため debug キーで署名しています。ストア配布や長期運用を
          する場合は自前のキーストアに差し替えてください。
          NOTES

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Tango $GITHUB_REF_NAME" \
            --notes-file notes.md \
            "${{ steps.apk.outputs.name }}"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
